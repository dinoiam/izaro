<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÍZAROcafè - Menù Digitale</title>
    <link id="theme-stylesheet" rel="stylesheet" type="text/css" href="tema-1.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="96x96" href="immagini/logo.png">

    <style>
        /* Selettore Lingua in alto a destra */
        .language-switcher {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 2000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 4px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            gap: 2px;
        }

        .lang-btn {
            border: none;
            background: none;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 15px;
            color: #555;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background-color: #333;
            color: #fff;
        }

        /* Stili per l'effetto accordion sulle descrizioni dei prodotti */
        .menu-item {
            cursor: pointer;
            padding: 10px 0;
        }

        .item-description {
            display: none;
            margin-top: 8px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Mostra la descrizione solo quando il prodotto è attivo */
        .menu-item.active .item-description {
            display: block;
        }
    </style>
</head>

<body>

    <!-- Selettore Lingua -->
    <div class="language-switcher">
        <button class="lang-btn active" onclick="switchLanguage('it')">IT</button>
        <button class="lang-btn" onclick="switchLanguage('en')">EN</button>
    </div>

    <header>
        <img src="logo.svg" alt="ÍZAROcafè" class="logo-svg">
        <div class="logo-sub" id="logo-sub-text">Benvenuti. Lasciatevi ispirare.</div>
    </header>

    <div class="sticky-header">
        <div class="search-bar">
            <input type="search" id="search-input" placeholder="Cerca nel menù..." autocomplete="off">
        </div>

        <nav id="categories-nav"></nav>
    </div>

    <div class="container" id="container"></div>

    <div class="no-results" id="no-results">
        <p id="no-results-title">Nessun prodotto trovato.</p>
        <p class="hint" id="no-results-hint">Prova con un'altra parola chiave.</p>
    </div>

    <footer id="site-footer"></footer>

    <script>
        let menuData = null;
        let currentSectionId = '';
        let observer = null;
        let currentLang = 'it'; // Lingua di default

        const placeholders = {
            it: { search: "Cerca nel menù...", sub: "Benvenuti. Lasciatevi ispirare.", noRes: "Nessun prodotto trovato.", hint: "Prova con un'altra parola chiave." },
            en: { search: "Search menu...", sub: "Welcome. Let yourself be inspired.", noRes: "No products found.", hint: "Try another keyword." }
        };

        const scrollMargin = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--scroll-margin')) || 145;

        fetch('data/menu.json')
            .then(r => r.json())
            .then(data => {
                menuData = data;
                updateStaticTexts();
                renderNav(data.sections);
                renderSections(data);
                renderFooter(data);
                initObserver(data.sections);
                initAccordion();
                document.getElementById('search-input').addEventListener('input', onSearch);
                document.getElementById('container').addEventListener('click', onSectionTitleClick);
            });

        function updateStaticTexts() {
            document.getElementById('search-input').placeholder = placeholders[currentLang].search;
            document.getElementById('logo-sub-text').innerText = placeholders[currentLang].sub;
            document.getElementById('no-results-title').innerText = placeholders[currentLang].noRes;
            document.getElementById('no-results-hint').innerText = placeholders[currentLang].hint;
        }

        function switchLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;

            // Aggiorna lo stato grafico dei bottoni
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === lang);
            });

            // Resetta la ricerca
            const input = document.getElementById('search-input');
            input.value = '';
            document.body.classList.remove('search-active');
            document.getElementById('no-results').style.display = 'none';

            // Ricarica l'interfaccia nella nuova lingua
            updateStaticTexts();
            renderNav(menuData.sections);
            renderSections(menuData);
            renderFooter(menuData);
            initObserver(menuData.sections);
            initAccordion();
        }

        function renderNav(sections) {
            const nav = document.getElementById('categories-nav');
            nav.innerHTML = sections.map(s =>
                `<a href="#${s.id}">${s.label[currentLang]}</a>`
            ).join('');
        }

        function renderSections(data) {
            const container = document.getElementById('container');

            const html = `
                ${data.sections.map(section => {
                let hasRenderedItem = false;
                return `
                        <section id="${section.id}">
                            <h2 class="section-title">${section.title[currentLang]}</h2>
                            ${section.infoBox ? `<div class="info-box">${section.infoBox[currentLang]}</div>` : ''}
                            ${section.content.map(block => {
                    if (block.type === 'customBox') {
                        hasRenderedItem = true;
                        const styleAttr = block.style
                            ? `style="background:${block.style.background};border-left-color:${block.style.borderLeftColor};margin-bottom:${block.style.marginBottom}"`
                            : '';
                        const paragraphs = block.paragraphs[currentLang] || [];
                        return `
                                        <div class="custom-box" ${styleAttr}>
                                            ${block.title ? `<h4>${block.title[currentLang]}</h4>` : ''}
                                            ${paragraphs.map(p => `<p style="margin-top:${paragraphs.indexOf(p) > 0 ? '4' : '0'}px">${p}</p>`).join('')}
                                        </div>
                                    `;
                    }
                    const subtitleClass = block.subtitle
                        ? (hasRenderedItem ? 'section-subtitle--spaced' : 'section-subtitle--first')
                        : '';
                    hasRenderedItem = true;
                    return `
                                    ${block.subtitle ? `<p class="section-subtitle ${subtitleClass}">${block.subtitle[currentLang]}</p>` : ''}
                                    ${block.items.map(item => `
                                        <div class="menu-item">
                                            <div class="item-main">
                                                <span class="item-name">${item.name[currentLang]}${item.detail ? ` <small style="font-weight:normal;color:var(--text-muted)">${item.detail}</small>` : ''}</span>
                                                ${item.allergens ? `<span class="allergen">(${item.allergens})</span>` : ''}
                                                <span class="item-price">${item.price}</span>
                                            </div>
                                            ${item.description ? `<div class="item-description">${item.description[currentLang]}</div>` : ''}
                                        </div>
                                    `).join('')}
                                `;
                }).join('')}
                        </section>
                    `;
            }).join('')}
            `;

            container.innerHTML = html;
        }

        function renderFooter(data) {
            const footer = document.getElementById('site-footer');
            const copyrightText = currentLang === 'it' ? 'Tutti i diritti riservati.' : 'All rights reserved.';
            const staffText = currentLang === 'it' ? 'Il registro completo è disponibile presso il nostro personale.' : 'The complete log is available with our staff.';
            
            footer.innerHTML = `
                <p><strong>${data.allergenLegend[currentLang]}</strong></p>
                <p style="margin-top: 10px;">${staffText}</p>
                <p style="margin-top: 15px; font-size:0.7rem; opacity:0.6;">&copy; 2026 ÍZAROcafè. ${copyrightText}</p>
            `;
        }

        function initObserver(sections) {
            if (observer) observer.disconnect();

            const navLinks = document.querySelectorAll('nav a');
            const visibleSections = new Set();

            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        visibleSections.add(entry.target.id);
                    } else {
                        visibleSections.delete(entry.target.id);
                    }
                });

                const activeId = sections.find(s => visibleSections.has(s.id))?.id;
                if (!activeId || activeId === currentSectionId) return;
                currentSectionId = activeId;

                navLinks.forEach(a => a.classList.remove('active'));
                const activeLink = document.querySelector(`nav a[href="#${currentSectionId}"]`);
                if (activeLink) {
                    activeLink.classList.add('active');
                    activeLink.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, { rootMargin: `-${scrollMargin}px 0px -40% 0px`, threshold: 0 });

            sections.forEach(s => {
                const el = document.getElementById(s.id);
                if (el) observer.observe(el);
            });
        }

        function initAccordion() {
            const container = document.getElementById('container');
            
            container.addEventListener('click', (e) => {
                const menuItem = e.target.closest('.menu-item');
                
                if (menuItem && menuItem.querySelector('.item-description')) {
                    document.querySelectorAll('.menu-item.active').forEach(item => {
                        if (item !== menuItem) item.classList.remove('active');
                    });
                    
                    menuItem.classList.toggle('active');
                }
            });
        }

        function onSearch(e) {
            const q = e.target.value.trim().toLowerCase();
            const isSearching = q.length > 0;

            document.body.classList.toggle('search-active', isSearching);
            document.getElementById('no-results').style.display = 'none';

            if (observer) {
                observer.disconnect();
                observer = null;
            }

            if (!isSearching) {
                renderSections(menuData);
                initObserver(menuData.sections);
                initAccordion();
                return;
            }

            const filtered = filterData(menuData, q);

            if (filtered.sections.length === 0) {
                document.getElementById('container').innerHTML = '';
                document.getElementById('no-results').style.display = 'block';
                return;
            }

            renderSections(filtered);
            initAccordion();
        }

        function filterData(data, query) {
            const q = query.toLowerCase();
            const sections = data.sections.map(s => {
                const sectionMatch = s.title[currentLang].toLowerCase().includes(q);
                return {
                    ...s,
                    content: s.content.map(b => {
                        if (b.type === 'customBox') return null;
                        if (sectionMatch) return b;
                        const subtitleMatch = b.subtitle && b.subtitle[currentLang].toLowerCase().includes(q);
                        if (subtitleMatch) return b;
                        const items = b.items.filter(item =>
                            item.name[currentLang].toLowerCase().includes(q) ||
                            (item.description && item.description[currentLang].toLowerCase().includes(q)) ||
                            (item.detail && item.detail.toLowerCase().includes(q)) ||
                            (item.allergens && item.allergens.toLowerCase().includes(q))
                        );
                        return items.length > 0 ? { ...b, items } : null;
                    }).filter(Boolean)
                };
            }).filter(s => s.content.length > 0);

            return { infoBox: data.infoBox, sections, allergenLegend: data.allergenLegend };
        }

        function onSectionTitleClick(e) {
            const title = e.target.closest('.section-title');
            if (title && document.body.classList.contains('search-active')) {
                const sectionId = title.closest('section').id;
                const input = document.getElementById('search-input');
                input.value = '';
                input.dispatchEvent(new Event('input'));
                requestAnimationFrame(() => {
                    document.getElementById(sectionId)?.scrollIntoView({ behavior: 'smooth' });
                });
            }
        }
    </script>
</body>

</html>
